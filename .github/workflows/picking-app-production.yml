name: picking-app-production

on:
  workflow_dispatch:
    inputs:
      target_root:
        description: "Ruta de producción en el servidor"
        required: false
        default: "C:\\inetpub\\warehouse-platform\\apps\\picking-app"
      pm2_name:
        description: "Nombre del proceso PM2"
        required: false
        default: "picking-app-backend"

jobs:
  build_and_deploy:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/picking-app/backend/package-lock.json
            apps/picking-app/frontend/package-lock.json

      - name: Build backend dependencies (lock validation)
        working-directory: apps/picking-app/backend
        run: npm ci

      - name: Build frontend
        working-directory: apps/picking-app/frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to production path
        shell: pwsh
        run: |
          .\infrastructure\scripts\deploy-picking-app.ps1 `
            -SourceRoot "${{ github.workspace }}\\apps\\picking-app" `
            -TargetRoot "${{ inputs.target_root }}" `
            -BackendPm2Name "${{ inputs.pm2_name }}"
